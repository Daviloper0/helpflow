name:                HelpFlow
version:             0.1.0.0
github:              "Daviloper0/HelpFlow"
license:             BSD-3-Clause
author:              "Davi Guimarães"
maintainer:          "davi.guimaraes@aluno.ufabc.edu.br"
copyright:           "2026 Davi Guimarães"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/HelpFlow#readme>

dependencies:
- base >= 4.7 && < 5
- text
- bcrypt
- uuid
- uuid-types
- persistent
- persistent-sqlite
- persistent-template
- servant
- servant-server
- aeson
- wai
- warp


ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  HelpFlow-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - HelpFlow
    - text
    - aeson
    - bcrypt
    - uuid
    - uuid-types
    - persistent
    - persistent-sqlite
    - persistent-template
    - servant
    - servant-server
    - wai
    - warp

tests:
  HelpFlow-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - HelpFlow
    - text
    - tasty
    - tasty-hunit
    - aeson
    - bcrypt
    - uuid
    - uuid-types
    - persistent
    - persistent-sqlite
    - persistent-template
    - servant
    - servant-server
    - wai
    - warp